services:
  trannergy2mqtt:
    build: .
    container_name: trannergy-mqtt
    restart: unless-stopped
    volumes:
      - ./config.py:/app/config.py
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'trannergy-mqtt.py' /proc/[0-9]*/cmdline || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
